<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strefa Gola - Podkarpacie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root {
            --navy: #0b162c;
            --navy-card: #132240;
            --green: #7ed321;
            --green-glow: rgba(126, 211, 33, 0.25);
            --gold: #f5a623;
            --white: #ffffff;
            --muted: #8b9bb4;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(19, 34, 64, 0.65);
            --radius: 18px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --promo: rgba(126, 211, 33, 0.12);
            --promo-border: #7ed321;
            --releg: rgba(235, 87, 87, 0.15);
            --releg-border: #eb5757;
            --bg-dark: #060d1b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-dark);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        h1, h2, h3, h4, .brand-font {
            font-family: 'Outfit', sans-serif;
        }

        /* Top Bar & Navigation */
        header {
            background: rgba(11, 22, 44, 0.95);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--white);
            text-decoration: none;
        }
        .logo i { color: var(--green); }

        nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
            padding: 0.55rem 1rem;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--white);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border);
        }

        .nav-btn.active {
            border-color: var(--green);
            color: var(--green);
            background: var(--green-glow);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 1.8rem auto;
            padding: 0 1rem;
        }

        /* Sub Navigation Tabs */
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--border);
            width: fit-content;
        }

        .sub-tab-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 0.55rem 1.2rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sub-tab-btn.active {
            background: var(--green);
            color: var(--navy);
            box-shadow: 0 4px 12px rgba(126, 211, 33, 0.3);
        }

        /* Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background: var(--navy-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: rgba(126, 211, 33, 0.4);
        }

        /* Post Card Styling */
        .post-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .post-card:hover {
            transform: translateY(-3px);
        }
        .post-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--green);
            background: rgba(126, 211, 33, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 0.6rem;
            width: fit-content;
        }
        .post-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--white);
            line-height: 1.35;
        }
        .post-meta {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.8rem;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .post-snippet {
            font-size: 0.88rem;
            color: #c0cdf0;
            line-height: 1.5;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .post-snippet a, .post-full a {
            color: var(--green);
            text-decoration: underline;
            word-break: break-all;
        }
        .read-more-btn {
            color: var(--green);
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: auto;
        }

        /* Club Card Styling */
        .club-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }
        .club-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(126, 211, 33, 0.15);
            border: 1px solid var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--green);
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .club-info-tag {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 6px;
            color: var(--muted);
            margin-top: 3px;
            display: inline-block;
        }
        .club-history-box {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: #c5d3eb;
            line-height: 1.5;
        }
        .club-stat-badge {
            font-size: 0.78rem;
            color: var(--gold);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Match Card Styling */
        .match-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            gap: 10px;
        }
        .team-name {
            font-weight: 600;
            font-size: 0.95rem;
            flex: 1;
        }
        .team-name.right { text-align: right; }
        .match-score {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--green);
            background: rgba(126,211,33,0.12);
            padding: 4px 12px;
            border-radius: 8px;
            min-width: 60px;
            text-align: center;
            border: 1px solid rgba(126,211,33,0.3);
        }
        .match-versus {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--muted);
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 8px;
        }

        /* Table Styling */
        .table-container {
            overflow-x: auto;
            background: var(--navy-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 0.85rem 1.1rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: rgba(0, 0, 0, 0.25);
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .rank { font-weight: 700; color: var(--gold); width: 40px; text-align: center; }
        .stat-val { font-weight: 700; color: var(--green); text-align: right; font-size: 1rem; }

        /* Modal View */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 9, 20, 0.82);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--navy);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 680px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.8rem;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .modal-close {
            position: absolute;
            top: 1.2rem; right: 1.2rem;
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--white);
            width: 34px; height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center; justify-content: center;
            transition: background 0.2s ease;
        }
        .modal-close:hover { background: rgba(255,255,255,0.2); }

        /* Buttons & Forms */
        .btn {
            background: var(--green);
            color: var(--navy);
            border: none;
            padding: 0.65rem 1.3rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-sm {
            padding: 0.35rem 0.7rem;
            font-size: 0.78rem;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: var(--white);
            border: none;
            cursor: pointer;
        }
        .btn-del { background: rgba(235,87,87,0.2); color: #ff6b6b; }
        .btn-del:hover { background: rgba(235,87,87,0.4); }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: var(--white);
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--green);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-futbol"></i>
                <span>STREFA GOLA <span style="color:var(--green); font-weight:400; font-size:0.9rem;">Podkarpacie</span></span>
            </a>
            <nav>
                <button class="nav-btn active" onclick="switchMainTab('posty', this)"><i class="fa-solid fa-newspaper"></i> Posty</button>
                <button class="nav-btn" onclick="switchMainTab('mecze', this)"><i class="fa-solid fa-calendar-days"></i> Mecze</button>
                <button class="nav-btn" onclick="switchMainTab('statystyki', this)"><i class="fa-solid fa-chart-simple"></i> Statystyki</button>
                <button class="nav-btn" onclick="switchMainTab('kluby', this)"><i class="fa-solid fa-shield-halved"></i> Kluby</button>
                <button class="nav-btn" onclick="switchMainTab('transfery', this)"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transfery</button>
                <button class="nav-btn" onclick="switchMainTab('admin', this)"><i class="fa-solid fa-lock"></i> Admin</button>
            </nav>
        </div>
    </header>

    <div class="container">

        <section id="tab-posty" class="tab-content active">
            <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                <h2><i class="fa-solid fa-newspaper" style="color:var(--green)"></i> Aktualności i Posty</h2>
            </div>
            <div id="posts-container" class="grid">
                </div>
        </section>

        <section id="tab-mecze" class="tab-content">
            <div style="margin-bottom: 1.2rem;">
                <h2><i class="fa-solid fa-calendar-days" style="color:var(--green)"></i> Rozgrywki Ligowe</h2>
            </div>
            
            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="switchMatchSubTab('upcoming', this)">
                    <i class="fa-solid fa-clock"></i> Nadchodzące mecze
                </button>
                <button class="sub-tab-btn" onclick="switchMatchSubTab('results', this)">
                    <i class="fa-solid fa-trophy"></i> Wyniki spotkań
                </button>
            </div>

            <div id="matches-container" class="grid">
                </div>
        </section>

        <section id="tab-statystyki" class="tab-content">
            <div style="margin-bottom: 1.2rem;">
                <h2><i class="fa-solid fa-chart-simple" style="color:var(--green)"></i> Statystyki Indywidualne</h2>
            </div>

            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="switchStatsSubTab('goals', this)">
                    <i class="fa-solid fa-futbol"></i> Najlepsi Strzelcy (Bramki)
                </button>
                <button class="sub-tab-btn" onclick="switchStatsSubTab('assists', this)">
                    <i class="fa-solid fa-shoe-prints"></i> Najlepsi Asystenci (Asysty)
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr id="stats-table-header">
                            <th class="rank">#</th>
                            <th>Zawodnik</th>
                            <th>Klub</th>
                            <th>Liga</th>
                            <th style="text-align: right;" id="stat-col-title">Bramki</th>
                        </tr>
                    </thead>
                    <tbody id="stats-table-body">
                        </tbody>
                </table>
            </div>
        </section>

        <section id="tab-kluby" class="tab-content">
            <div style="margin-bottom: 1.5rem;">
                <h2><i class="fa-solid fa-shield-halved" style="color:var(--green)"></i> Kluby Podkarpacia</h2>
                <p style="color:var(--muted); font-size:0.9rem; margin-top:4px;">Poznaj unikalną historię i osiągnięcia podkarpackich zespołów.</p>
            </div>
            <div id="clubs-container" class="grid">
                </div>
        </section>

        <section id="tab-transfery" class="tab-content">
            <div style="margin-bottom: 1.5rem;">
                <h2><i class="fa-solid fa-arrow-right-arrow-left" style="color:var(--green)"></i> Rynek Transferowy</h2>
            </div>
            <div id="transfers-container" class="grid">
                </div>
        </section>

        <section id="tab-admin" class="tab-content">
            <div style="max-width: 600px; margin: 0 auto; background: var(--navy-card); padding: 1.8rem; border-radius: var(--radius); border: 1px solid var(--border);">
                <h2><i class="fa-solid fa-user-gear" style="color:var(--green)"></i> Panel Zarządzania</h2>
                <p style="color:var(--muted); font-size:0.85rem; margin-bottom: 1.5rem;">Dodawaj treści do serwisu Strefa Gola</p>

                <div class="form-group">
                    <label>Kategoria dodawanej treści</label>
                    <select id="admin-type" class="form-control" onchange="toggleAdminFields()">
                        <option value="post">Nowy Post / Artykuł</option>
                        <option value="match">Nowy Mecz (Wynik / Terminarz)</option>
                        <option value="stat">Statystyka (Gole / Asysty)</option>
                        <option value="transfer">Nowy Transfer</option>
                    </select>
                </div>

                <div id="form-post">
                    <div class="form-group">
                        <label>Tytuł Posta</label>
                        <input type="text" id="post-title-in" class="form-control" placeholder="np. Sensacja w Derbach Rzeszowa!">
                    </div>
                    <div class="form-group">
                        <label>Liga / Kategoria</label>
                        <input type="text" id="post-league-in" class="form-control" placeholder="np. IV Liga Podkarpacka">
                    </div>
                    <div class="form-group">
                        <label>Treść Posta (Linki będą automatycznie klikalne)</label>
                        <textarea id="post-content-in" class="form-control" placeholder="Wpisz treść... Możesz wklejać linki https://..."></textarea>
                    </div>
                </div>

                <div id="form-match" style="display:none;">
                    <div class="form-group">
                        <label>Gospodarz</label>
                        <input type="text" id="match-home-in" class="form-control" placeholder="np. Stal Rzeszów">
                    </div>
                    <div class="form-group">
                        <label>Gość</label>
                        <input type="text" id="match-away-in" class="form-control" placeholder="np. Resovia Rzeszów">
                    </div>
                    <div class="form-group">
                        <label>Status Meczu</label>
                        <select id="match-status-in" class="form-control" onchange="toggleScoreInput()">
                            <option value="upcoming">Nadchodzący mecz</option>
                            <option value="finished">Zakończony (Wynik)</option>
                        </select>
                    </div>
                    <div class="form-group" id="score-group" style="display:none;">
                        <label>Wynik (Gospodarz - Gość)</label>
                        <input type="text" id="match-score-in" class="form-control" placeholder="np. 2:1">
                    </div>
                    <div class="form-group">
                        <label>Data i godzina / Liga</label>
                        <input type="text" id="match-info-in" class="form-control" placeholder="np. Sobota 17:00 | IV Liga">
                    </div>
                </div>

                <div id="form-stat" style="display:none;">
                    <div class="form-group">
                        <label>Typ Statystyki</label>
                        <select id="stat-type-in" class="form-control">
                            <option value="goals">Bramki (Strzelcy)</option>
                            <option value="assists">Asysty (Asystenci)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Imię i Nazwisko Zawodnika</label>
                        <input type="text" id="stat-player-in" class="form-control" placeholder="np. Jan Kowalski">
                    </div>
                    <div class="form-group">
                        <label>Klub</label>
                        <input type="text" id="stat-club-in" class="form-control" placeholder="np. Stal Mielec">
                    </div>
                    <div class="form-group">
                        <label>Ilość (Goli lub Asyst)</label>
                        <input type="number" id="stat-count-in" class="form-control" placeholder="np. 12">
                    </div>
                </div>

                <div id="form-transfer" style="display:none;">
                    <div class="form-group">
                        <label>Zawodnik</label>
                        <input type="text" id="tr-player" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Z Klubu</label>
                        <input type="text" id="tr-from" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Do Klubu</label>
                        <input type="text" id="tr-to" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Kwota / Typ</label>
                        <input type="text" id="tr-fee" class="form-control" placeholder="np. Gotówka / Szybkie Wypożyczenie">
                    </div>
                </div>

                <button class="btn" style="width:100%; justify-content:center; margin-top:1rem;" onclick="saveAdminData()">
                    <i class="fa-solid fa-plus"></i> Zapisz wpis
                </button>
            </div>
        </section>

    </div>

    <div id="post-modal" class="modal-overlay" onclick="closePostModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closePostModal()"><i class="fa-solid fa-xmark"></i></button>
            <span id="modal-post-tag" class="post-tag">Wiadomości</span>
            <h2 id="modal-post-title" style="margin-top:8px; margin-bottom:10px; font-size:1.4rem;"></h2>
            <div id="modal-post-meta" class="post-meta"></div>
            <div id="modal-post-body" class="post-full" style="font-size:0.95rem; line-height:1.6; color:#dbe5f7; margin-top:1rem; border-top:1px solid var(--border); padding-top:1rem;"></div>
        </div>
    </div>

    <script>
        // --- DANE Domyślne / PRZYKŁADOWE (Dla natychmiastowego działania) ---
        
        // 1. Kluby z unikalną własną historią
        const clubsData = [
            {
                name: "Stal Rzeszów",
                city: "Rzeszów",
                founded: "1938",
                achievement: "Puchar Polski (1975), Gra w I lidze",
                colors: "Biało-Niebieskie",
                history: "Duma stolicy Podkarpacia z bogatą tradycją pucharową. Największym sukcesem w historii klubu było zdobycie Pucharu Polski w 1975 roku oraz występ w Ćwierćfinale Pucharu Zdobywców Pucharów."
            },
            {
                name: "Resovia Rzeszów",
                city: "Rzeszów",
                founded: "1905",
                achievement: "Półfinał Pucharu Polski (1981)",
                colors: "Czerwono-Białe",

        // --- POMOCNICZA FUNKCJA: Przekształcanie tekstu i wyrywanie linków ---
        function formatTextWithLinks(text) {
            if (!text) return '';
            // Bezpieczne kodowanie HTML
            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // Regex dla linków http/https/www
            const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;
            
            const withLinks = safeText.replace(urlRegex, function(url) {
                let href = url;
                if (!href.startsWith('http://') && !href.startsWith('https://')) {
                    href = 'http://' + href;
                }
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${url}</a>`;
            });

            // Podmiana znaków nowej linii na <br>
            return withLinks.replace(/\n/g, '<br>');
        }

        // --- ZMIANA ZAKŁADEK GŁÓWNYCH ---
        function switchMainTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        // --- OBSŁUGA POSTÓW & MODAL ---
        function renderPosts() {
            const container = document.getElementById('posts-container');
            if (!postsData.length) {
                container.innerHTML = `<p style="color:var(--muted)">Brak aktualnych postów.</p>`;
                return;
            }

            container.innerHTML = postsData.map(post => `
                <div class="card post-card" onclick="openPostModal('${post.id}')">
                    <div>
                        <span class="post-tag">${post.league || 'Aktualności'}</span>
                        <h3 class="post-title">${post.title}</h3>
                        <div class="post-meta">
                            <span><i class="fa-regular fa-clock"></i> ${post.date || 'Dzisiaj'}</span>
                        </div>
                        <div class="post-snippet">${formatTextWithLinks(post.content)}</div>
                    </div>
                    <div class="read-more-btn">
                        Czytaj całość <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            `).join('');
        }

        function openPostModal(id) {
            const post = postsData.find(p => p.id === id);
            if (!post) return;

            document.getElementById('modal-post-tag').innerText = post.league || 'Aktualności';
            document.getElementById('modal-post-title').innerText = post.title;
            document.getElementById('modal-post-meta').innerHTML = `<i class="fa-regular fa-calendar"></i> Opublikowano: ${post.date || 'Dzisiaj'}`;
            document.getElementById('modal-post-body').innerHTML = formatTextWithLinks(post.content);

            document.getElementById('post-modal').classList.add('active');
        }

        function closePostModal(e) {
            if (!e || e.target === document.getElementById('post-modal') || e.target.closest('.modal-close')) {
                document.getElementById('post-modal').classList.remove('active');
            }
        }

        // --- OBSŁUGA MECZÓW (Nadchodzące / Wyniki) ---
        let currentMatchFilter = 'upcoming';

        function switchMatchSubTab(type, btn) {
            currentMatchFilter = type;
            document.querySelectorAll('#tab-mecze .sub-tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            const filtered = matchesData.filter(m => m.status === currentMatchFilter);

            if (!filtered.length) {
                container.innerHTML = `<p style="color:var(--muted); grid-column:1/-1;">Brak meczów w tej kategorii.</p>`;
                return;
            }

            container.innerHTML = filtered.map(m => `
                <div class="card match-card">
                    <div class="match-header">
                        <span>${m.info || 'Rozgrywki'}</span>
                        <span><i class="fa-solid fa-circle" style="font-size:0.5rem; color:${m.status === 'finished' ? 'var(--gold)' : 'var(--green)'}"></i> ${m.status === 'finished' ? 'Zakończony' : 'Zapowiedź'}</span>
                    </div>
                    <div class="match-teams">
                        <span class="team-name">${m.home}</span>
                        ${m.status === 'finished' 
                            ? `<span class="match-score">${m.score || '0 : 0'}</span>` 
                            : `<span class="match-versus">VS</span>`}
                        <span class="team-name right">${m.away}</span>
                    </div>
                </div>
            `).join('');
        }

        // --- OBSŁUGA STATYSTYK (Gole / Asysty) ---
        let currentStatsFilter = 'goals';

        function switchStatsSubTab(type, btn) {
            currentStatsFilter = type;
            document.querySelectorAll('#tab-statystyki .sub-tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            document.getElementById('stat-col-title').innerText = type === 'goals' ? 'Bramki' : 'Asysty';
            renderStats();
        }

        function renderStats() {
            const body = document.getElementById('stats-table-body');
            const filtered = statsData
                .filter(s => (s.type || 'goals') === currentStatsFilter)
                .sort((a, b) => b.count - a.count);

            if (!filtered.length) {
                body.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--muted);">Brak wpisów w tej kategorii statystyk.</td></tr>`;
                return;
            }

            body.innerHTML = filtered.map((s, idx) => `
                <tr>
                    <td class="rank">${idx + 1}</td>
                    <td style="font-weight:600;">${s.player}</td>
                    <td>${s.club}</td>
                    <td><span style="font-size:0.8rem; color:var(--muted);">${s.league || 'IV Liga'}</span></td>
                    <td class="stat-val">${s.count}</td>
                </tr>
            `).join('');
        }

        // --- ZARZĄDZANIE FORMULARZAMI ADMINA ---
        function toggleAdminFields() {
            const type = document.getElementById('admin-type').value;
            document.getElementById('form-post').style.display = type === 'post' ? 'block' : 'none';
            document.getElementById('form-match').style.display = type === 'match' ? 'block' : 'none';
            document.getElementById('form-stat').style.display = type === 'stat' ? 'block' : 'none';
            document.getElementById('form-transfer').style.display = type === 'transfer' ? 'block' : 'none';
        }

        function toggleScoreInput() {
            const status = document.getElementById('match-status-in').value;
            document.getElementById('score-group').style.display = status === 'finished' ? 'block' : 'none';
        }

        function saveAdminData() {
            const type = document.getElementById('admin-type').value;

            if (type === 'post') {
                const title = document.getElementById('post-title-in').value;
                const league = document.getElementById('post-league-in').value;
                const content = document.getElementById('post-content-in').value;

                if (!title || !content) { alert('Wypełnij tytuł i treść!'); return; }

                postsData.unshift({
                    id: 'p' + Date.now(),
                    title: title,
                    league: league || 'Aktualności',
                    date: new Date().toLocaleDateString('pl-PL'),
                    content: content
                });

                renderPosts();
                alert('Post został pomyślnie dodany!');
                document.getElementById('post-title-in').value = '';
                document.getElementById('post-content-in').value = '';
            } 
            else if (type === 'match') {
                const home = document.getElementById('match-home-in').value;
                const away = document.getElementById('match-away-in').value;
                const status = document.getElementById('match-status-in').value;
                const score = document.getElementById('match-score-in').value;
                const info = document.getElementById('match-info-in').value;

                if (!home || !away) { alert('Podaj nazwy obu drużyn!'); return; }

                matchesData.unshift({
                    id: 'm' + Date.now(),
                    home: home,
                    away: away,
                    status: status,
                    score: score,
                    info: info || 'Mecz Ligowy'
                });

                renderMatches();
                alert('Mecz został zapisany!');
            }
            else if (type === 'stat') {
                const statType = document.getElementById('stat-type-in').value;
                const player = document.getElementById('stat-player-in').value;
                const club = document.getElementById('stat-club-in').value;
                const count = parseInt(document.getElementById('stat-count-in').value) || 0;

                if (!player || !club) { alert('Wypełnij dane zawodnika!'); return; }

                statsData.push({
                    id: 's' + Date.now(),
                    player: player,
                    club: club,
                    league: 'IV Liga',
                    count: count,
                    type: statType
                });

                renderStats();
                alert('Statystyka dodana!');
            }
            else if (type === 'transfer') {
                const player = document.getElementById('tr-player').value;
                const from = document.getElementById('tr-from').value;
                const to = document.getElementById('tr-to').value;
                const fee = document.getElementById('tr-fee').value;

                if (!player || !from || !to) { alert('Wypełnij dane transferu!'); return; }

                transfersData.unshift({
                    id: 't' + Date.now(),
                    player: player,
                    from: from,
                    to: to,
                    fee: fee || 'Nieujawniona'
                });

                renderTransfers();
                alert('Transfer dodany!');
            }
        }

        // INICJALIZACJA STRONY
        window.addEventListener('DOMContentLoaded', () => {
            renderPosts();
            renderMatches();
            renderStats();
            renderClubs();
