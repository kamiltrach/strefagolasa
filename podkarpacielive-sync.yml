name: PodkarpacieLIVE → Firestore

on:
  workflow_dispatch:
  schedule:
    # Wyniki: co 5 minut.
    - cron: '*/5 * * * *'
    # Próba importu najbliższej kolejki: poniedziałek 03:10 UTC.
    - cron: '10 3 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync PodkarpacieLIVE
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE2_SERVICE_ACCOUNT: ${{ secrets.FIREBASE2_SERVICE_ACCOUNT }}
        run: node podkarpacielive-sync.mjs
